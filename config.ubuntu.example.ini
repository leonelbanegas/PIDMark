; Plantilla de configuración para PID Mark en Ubuntu Server.
; Copiar como /etc/pid-mark/config.ini y adaptar permisos/rutas.

[Rutas]
CarpetaImagenes=/var/lib/pid-mark/imagenes
CarpetaDatos=/var/lib/pid-mark
CarpetaBackups=/var/lib/pid-mark/backups
CarpetaLogs=/var/lib/pid-mark/logs
BaseDatos=/var/lib/pid-mark/pid.db

[Administracion]
AdminUsuarios=

[Autenticacion]
Modo=password
UsuarioSemilla=admin

[Marcadores]
TamanoPorDefecto=14
TamanoEtiquetaMax=150
FormaPorDefecto=circulo
ColorAbierto=#00C853
ColorCerrado=#D50000
ColorOtro=#2962FF
TransparenciaRelleno=0.5
GrosorBorde=3
ParpadeoVeces=5
ParpadeoIntervalo=250

[Lupa]
Zoom=3
Tamano=180
MostrarMarcaciones=false

[Exportacion]
DPI=300
TamanoHoja=A3
Orientacion=horizontal

[Interfaz]
Tema=oscuro
Idioma=es
