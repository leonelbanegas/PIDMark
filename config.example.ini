; Plantilla de configuracion para PID Mark.
; Copiar este archivo como config.ini y ajustar las rutas antes de iniciar.
; No guardar aqui contrasenas, usuarios reales ni rutas de red internas.

[Rutas]
CarpetaImagenes=C:\PID-DATOS\imagenes
CarpetaDatos=C:\PID-DATOS
CarpetaBackups=C:\PID-DATOS\backups
CarpetaLogs=C:\PID-DATOS\logs
BaseDatos=C:\PID-DATOS\pid.db

[Administracion]
; Solo se usa en modo windows. Separar varios usuarios con comas.
AdminUsuarios=

[Autenticacion]
; Opciones: windows | password
Modo=password
UsuarioSemilla=admin

[Marcadores]
TamanoPorDefecto=14
TamanoEtiquetaMax=150
FormaPorDefecto=circulo
ColorAbierto=#00C853
ColorCerrado=#D50000
ColorOtro=#2962FF
TransparenciaRelleno=0.5
GrosorBorde=3
ParpadeoVeces=5
ParpadeoIntervalo=250

[Lupa]
Zoom=3
Tamano=180
MostrarMarcaciones=false

[Exportacion]
DPI=300
TamanoHoja=A3
Orientacion=horizontal

[Interfaz]
Tema=oscuro
Idioma=es
