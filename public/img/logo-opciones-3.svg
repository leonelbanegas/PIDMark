<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" font-family="system-ui, Arial, sans-serif">
  <rect width="900" height="1100" fill="#1a1a1a"/>
  <text x="450" y="42" fill="#ffffff" font-size="26" font-weight="bold" text-anchor="middle">P&amp;ID Mark - Opciones (P sobre M)</text>
  <text x="450" y="68" fill="#888" font-size="14" text-anchor="middle">Color principal: #D50000</text>

  <!-- 1: P tenue grande arriba, M blanca abajo, punto de mira a la derecha -->
  <g transform="translate(30,90)">
    <rect width="400" height="190" rx="12" fill="#222"/>
    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">1</text>
    <g transform="translate(200,105)">
      <text x="0" y="-6" fill="#D50000" font-size="46" font-weight="bold" text-anchor="middle" opacity="0.55">P</text>
      <text x="0" y="44" fill="#ffffff" font-size="58" font-weight="bold" text-anchor="middle">M</text>
      <circle cx="42" cy="-24" r="8" fill="none" stroke="#D50000" stroke-width="3"/>
      <line x1="42" y1="-16" x2="42" y2="-8" stroke="#D50000" stroke-width="2"/>
    </g>
  </g>

  <!-- 2: P roja arriba, M blanca abajo, mira entre ambas -->
  <g transform="translate(470,90)">
    <rect width="400" height="190" rx="12" fill="#222"/>
    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">2</text>
    <g transform="translate(200,105)">
      <text x="0" y="-4" fill="#D50000" font-size="46" font-weight="bold" text-anchor="middle">P</text>
      <text x="0" y="46" fill="#ffffff" font-size="58" font-weight="bold" text-anchor="middle">M</text>
      <circle cx="0" cy="20" r="7" fill="none" stroke="#D50000" stroke-width="3"/>
    </g>
  </g>

  <!-- 3: P y M apiladas compactas con cruz arriba -->
  <g transform="translate(30,300)">
    <rect width="400" height="190" rx="12" fill="#222"/>
    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">3</text>
    <g transform="translate(200,105)">
      <line x1="0" y1="-52" x2="0" y2="-34" stroke="#D50000" stroke-width="3"/>
      <line x1="-9" y1="-43" x2="9" y2="-43" stroke="#D50000" stroke-width="3"/>
      <text x="0" y="-2" fill="#D50000" font-size="42" font-weight="bold" text-anchor="middle">P</text>
      <text x="0" y="44" fill="#ffffff" font-size="56" font-weight="bold" text-anchor="middle">M</text>
    </g>
  </g>

  <!-- 4: P grande tenue, M encima en blanco (invertido) -->
  <g transform="translate(470,300)">
    <rect width="400" height="190" rx="12" fill="#222"/>
    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">4</text>
    <g transform="translate(200,105)">
      <text x="0" y="-6" fill="#D50000" font-size="58" font-weight="bold" text-anchor="middle" opacity="0.4">P</text>
      <text x="0" y="44" fill="#ffffff" font-size="50" font-weight="bold" text-anchor="middle">M</text>
      <circle cx="-44" cy="-20" r="7" fill="none" stroke="#D50000" stroke-width="3"/>
    </g>
  </g>

  <!-- 5: P con mira a la izquierda, M abajo -->
  <g transform="translate(30,510)">
    <rect width="400" height="190" rx="12" fill="#222"/>
    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">5</text>
    <g transform="translate(200,105)">
      <circle cx="-38" cy="-12" r="16" fill="none" stroke="#D50000" stroke-width="3"/>
      <line x1="-38" y1="-30" x2="-38" y2="-40" stroke="#D50000" stroke-width="2"/>
      <line x1="-38" y1="4" x2="-38" y2="14" stroke="#D50000" stroke-width="2"/>
      <text x="0" y="-2" fill="#D50000" font-size="44" font-weight="bold" text-anchor="middle">P</text>
      <text x="0" y="44" fill="#ffffff" font-size="56" font-weight="bold" text-anchor="middle">M</text>
    </g>
  </g>

  <!-- 6: P sobre M con P tenue detrás y mira dentro de la P -->
  <g transform="translate(470,510)">
    <rect width="400" height="190" rx="12" fill="#222"/>
    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">6</text>
    <g transform="translate(200,105)">
      <text x="0" y="-4" fill="#D50000" font-size="48" font-weight="bold" text-anchor="middle" opacity="0.5">P</text>
      <text x="0" y="-4" fill="#ffffff" font-size="44" font-weight="bold" text-anchor="middle">M</text>
      <text x="0" y="46" fill="#D50000" font-size="44" font-weight="bold" text-anchor="middle">P</text>
      <circle cx="0" cy="-4" r="5" fill="none" stroke="#D50000" stroke-width="2"/>
    </g>
  </g>

  <!-- 7: P grande con mira, M chiquita abajo -->
  <g transform="translate(30,720)">
    <rect width="400" height="190" rx="12" fill="#222"/>
    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">7</text>
    <g transform="translate(200,105)">
      <circle cx="0" cy="-14" r="34" fill="none" stroke="#D50000" stroke-width="4"/>
      <text x="0" y="0" fill="#D50000" font-size="38" font-weight="bold" text-anchor="middle">P</text>
      <text x="0" y="54" fill="#ffffff" font-size="40" font-weight="bold" text-anchor="middle">M</text>
    </g>
  </g>

  <!-- 8: P sobre M con marcador # al lado -->
  <g transform="translate(470,720)">
    <rect width="400" height="190" rx="12" fill="#222"/>
    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">8</text>
    <g transform="translate(200,105)">
      <text x="-40" y="-6" fill="#D50000" font-size="46" font-weight="bold" text-anchor="middle" opacity="0.6">P</text>
      <text x="-40" y="44" fill="#ffffff" font-size="56" font-weight="bold" text-anchor="middle">M</text>
      <text x="40" y="34" fill="#D50000" font-size="46" font-weight="bold" text-anchor="middle">#</text>
    </g>
  </g>

  <!-- 9: P con corona tenue encima, M debajo, mira centrada -->
  <g transform="translate(30,930)">
    <rect width="400" height="150" rx="12" fill="#222"/>
    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">9</text>
    <g transform="translate(200,80)">
      <text x="0" y="-6" fill="#D50000" font-size="40" font-weight="bold" text-anchor="middle" opacity="0.5">P</text>
      <text x="0" y="40" fill="#ffffff" font-size="56" font-weight="bold" text-anchor="middle">M</text>
      <line x1="0" y1="-32" x2="0" y2="-44" stroke="#D50000" stroke-width="3"/>
      <line x1="-7" y1="-38" x2="7" y2="-38" stroke="#D50000" stroke-width="3"/>
    </g>
  </g>

  <!-- 10: P sobre M con anillo de mira alrededor de la P -->
  <g transform="translate(470,930)">
    <rect width="400" height="150" rx="12" fill="#222"/>
    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">10</text>
    <g transform="translate(200,80)">
      <circle cx="0" cy="-12" r="32" fill="none" stroke="#D50000" stroke-width="3" stroke-dasharray="6 5"/>
      <text x="0" y="-2" fill="#D50000" font-size="40" font-weight="bold" text-anchor="middle">P</text>
      <text x="0" y="48" fill="#ffffff" font-size="52" font-weight="bold" text-anchor="middle">M</text>
    </g>
  </g>

  <text x="450" y="1090" fill="#888" font-size="12" text-anchor="middle">Decime el número elegido y lo aplico como favicon + logo.</text>
</svg>
