<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" font-family="system-ui, Arial, sans-serif">
  <rect width="900" height="1100" fill="#1a1a1a"/>
  <text x="450" y="42" fill="#ffffff" font-size="26" font-weight="bold" text-anchor="middle">P&amp;ID Mark - Opciones de logo</text>
  <text x="450" y="68" fill="#888" font-size="14" text-anchor="middle">Color principal: #D50000 (rojo)</text>

  <!-- Fila 1 -->
  <g transform="translate(30,90)">
