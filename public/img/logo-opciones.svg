    <text x="14" y="28" fill="#D50000" font-size="22" font-weight="bold">1</text>
    <g transform="translate(150,40)">
      <rect x="10" y="40" width="45" height="45" rx="3" fill="none" stroke="#D50000" stroke-width="5"/>
      <circle cx="90" cy="62" r="24" fill="none" stroke="#D50000" stroke-width="5"/>
      <line x1="90" y1="38" x2="90" y2="20" stroke="#D50000" stroke-width="3"/>
      <rect x="64" y="0" width="52" height="22" rx="5" fill="none" stroke="#D50000" stroke-width="3"/>
