<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>P&amp;ID Mark - Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .loginFondo {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #121212; padding: 24px; box-sizing: border-box;
    }
    body.temaClaro .loginFondo { background: #f2f3f5; }
    .loginCaja {
      /* Ancho suficiente para: 205 (logo) + 18 (gap) + 171,5 (Tecpetrol)
         + 18*2 (padding) = 430,5px. Asi el gap y los margenes laterales
         miden lo mismo. */
      width: 100%; max-width: 432px; background: #1e1e1e; border: 1px solid #333;
      border-radius: 10px; padding: 28px 18px; box-sizing: border-box;
    }
    body.temaClaro .loginCaja { background: #ffffff; border-color: #dfe1e5; }
    .loginLogo {
      display: flex; align-items: center; justify-content: space-between;
      /* Mismo valor que el padding lateral de .loginCaja (18px). */
      gap: 18px; margin-bottom: 18px;
    }
    /* Misma altura que los logos del resto de la app (97px). */
    .loginLogo img { height: 97px; width: auto; display: block; }
    .loginLogo .logoPidSvg { height: 97px; width: auto; display: block; }
    .loginCaja h1 { font-size: 18px; margin: 0 0 18px; text-align: center; color: #fff; }
    body.temaClaro .loginCaja h1 { color: #1c1c1c; }
    .loginCaja label { display: block; font-size: 13px; color: #ccc; margin-bottom: 12px; }
    body.temaClaro .loginCaja label { color: #444; }
    .loginCaja input {
      width: 100%; padding: 9px 10px; font-size: 14px; margin-top: 4px;
      background: #121212; border: 1px solid #444; color: #eee; border-radius: 6px;
      box-sizing: border-box;
    }
    body.temaClaro .loginCaja input { background: #f7f8fa; border-color: #cfd3d9; color: #1c1c1c; }
    .loginCaja input:focus { outline: none; border-color: #2962FF; box-shadow: 0 0 0 2px rgba(41,98,255,0.35); }
    .loginBoton {
      width: 100%; padding: 10px; font-size: 14px; margin-top: 6px;
      background: #2962FF; border: 1px solid #2962FF; color: #fff; border-radius: 6px; cursor: pointer;
    }
    .loginBoton:hover:not(:disabled) { background: #1e4fd6; }
    .loginBoton:disabled { opacity: 0.5; cursor: not-allowed; }
    .loginError { color: #e07070; font-size: 13px; margin-top: 10px; min-height: 16px; text-align: center; }
    .loginAviso { margin: 0 0 6px; font-size: 14px; text-align: center; color: #fff; }
    body.temaClaro .loginAviso { color: #1c1c1c; }
    .loginAvisoChico { margin: 0 0 14px; font-size: 12px; text-align: center; color: #9aa0a6; }
    .loginBotonSecundario {
      width: 100%; padding: 8px; font-size: 13px; margin-top: 8px;
      background: transparent; border: 1px solid #444; color: #bbb;
      border-radius: 6px; cursor: pointer;
    }
    .loginBotonSecundario:hover { background: #2a2a2a; color: #fff; }
    body.temaClaro .loginBotonSecundario { border-color: #cfd3d9; color: #444; }
    body.temaClaro .loginBotonSecundario:hover { background: #eef0f3; color: #111; }
  </style>
</head>

        <img src="img/tecpetrol.png" alt="Tecpetrol">
      </div>
      <h1 id="loginTitulo">Iniciar sesión</h1>

      <!-- PASO 1: usuario + contraseña -->
      <div id="bloqueLogin">
        <label>Usuario
          <input type="text" id="inpUsuario" autocomplete="username" required>
        </label>
        <label>Contraseña
          <input type="password" id="inpPassword" autocomplete="current-password">
        </label>
        <button type="submit" class="loginBoton" id="btnIngresar">Ingresar</button>
      </div>

      <!-- PASO 2: usuario nuevo SIN clave -> la define aca -->
      <div id="bloqueCrearClave" style="display:none;">
        <p class="loginAviso" id="txtCrearClaveUsuario"></p>
        <p class="loginAvisoChico">Es la primera vez que ingresás. Creá tu contraseña (mínimo 6 caracteres).</p>
        <label>Clave
          <input type="password" id="inpClaveNueva" autocomplete="new-password">
        </label>
        <label>Repetir clave
          <input type="password" id="inpClaveNueva2" autocomplete="new-password">
        </label>
        <button type="button" class="loginBoton" id="btnCrearClave">Crear clave e ingresar</button>
        <button type="button" class="loginBotonSecundario" id="btnVolverLogin">← Volver</button>
      </div>

      <div class="loginError" id="loginError"></div>
    </form>
  </div>

  <script src="js/login.js"></script>
